[versions]
# libraries
annotations = "26.+"
gson = "2.13.+"
junit = "4.13+"
junit-vintage = "6.0+"
mockito-kotlin = "6.2+"
sentry = "8+"

# plugins
gradleIntelliJPlatformPlugin = "2.16.0"
# https://github.com/JetBrains/gradle-grammar-kit-plugin is now archived
# This project is archived and no longer maintained. Version 2023.3.0.4 is the final release.
# Migrate to the IntelliJ Platform Gradle Plugin and its org.jetbrains.intellij.platform.grammarkit
# subplugin, which now handle all Grammar-Kit integration.
grammarkit = "2023.3.0.4" # todo: migrate to new way of setting up lexer/parser in Gradle file
kotlin = "2.4.+"
kover = "0.9.9"
coverallsJacoco = "1.2.20"

[plugins]
gradleIntelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "gradleIntelliJPlatformPlugin" }
gradleIntelliJModule = { id = "org.jetbrains.intellij.platform.module", version.ref = "gradleIntelliJPlatformPlugin" }
grammarkit = { id = "org.jetbrains.grammarkit", version.ref = "grammarkit" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
coverallsJacoco = { id = "com.github.nbaztec.coveralls-jacoco", version.ref = "coverallsJacoco" }

[libraries]
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-vintage" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
sentry = { module ="io.sentry:sentry", version.ref = "sentry" }
